[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tml-smlm"
version = "0.1.0"
description = "Topological machine learning for single-molecule localization microscopy: a multi-scale, confound-audited pipeline for punctate subcellular structures"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "joblib>=1.3",
    "ripser>=0.6.4",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
